# Migrações do zero num Supabase local (Docker do runner) e pgTAP de supabase/tests. Sem segredos e sem link com
# projeto hospedado: só `supabase start` local.
name: Testes (banco)

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/testes-banco.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/testes-banco.yml']

permissions: {}

concurrency:
  group: testes-banco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      # Só o banco: os demais serviços não entram no teste.
      - run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta,postgrest,kong,gotrue
      - run: supabase test db
