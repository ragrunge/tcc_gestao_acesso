# Typecheck, build e testes unitários do front e do domain. O e2e (Playwright) roda no workflow integracao.yml, contra o
# Supabase local do runner.
name: Testes (domain e web)

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: testes-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: node:22-bookworm-slim
    permissions:
      contents: read
    env:
      CI: 'true'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: chave-ficticia-de-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
